# CI 工作流
# 在每次 push 和 pull request 时运行测试和代码检查

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # 测试作业
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run linter
        run: npm run lint

      - name: 🏗️ Compile TypeScript
        run: npm run compile

      - name: 🧪 Run tests
        run: npm test

      - name: 📊 Upload coverage (if exists)
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # 构建验证作业
  build:
    name: Build verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build project
        run: npm run build

      - name: 📦 Package extension
        run: npm run package

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: "*.vsix"
          retention-days: 7

  # 安全检查作业
  security:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Run security audit
        run: npm audit --audit-level=moderate

      - name: 🛡️ Run license check
        run: npx license-checker --production --onlyAllow="MIT;Apache-2.0;ISC;BSD" --summary

  # 格式检查作业
  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Check formatting
        run: npm run lint
        continue-on-error: false

  # 发布预检查（仅在打 tag 时运行）
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build and package
        run: |
          npm run compile
          npm run package

      - name: ✅ Validate version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format"
            exit 1
          fi
          echo "✅ Valid version format"

      - name: 📦 Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: "*.vsix"
          retention-days: 30

  # 总结作业
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, build, security, format]

    steps:
      - name: 📊 CI Status
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Ready for deployment!" >> $GITHUB_STEP_SUMMARY
